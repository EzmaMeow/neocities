    <script type="module">
        import { start_fishing_game } from "./fishing.js"
        import { Inventory } from "/scripts/inventory.js"

        const game = await start_fishing_game();
        const inventory = new Inventory('inventory')
        inventory.typeMap = game.fish_data;

        const inventoryPreviousButton = document.getElementById('inventory_previous');
        const inventoryNextButton = document.getElementById('inventory_next');
        function updateInventoryButtons() {
            inventoryPreviousButton.hidden = !inventory.hasPreviousPage();
            inventoryNextButton.hidden = !inventory.hasNextPage();
        }
        inventoryPreviousButton.addEventListener('click', (event) => {
            inventory.previousPage();
            updateInventoryButtons()
        })
        inventoryNextButton.addEventListener('click', (event) => {
            inventory.nextPage();
            updateInventoryButtons()
        })

        inventory.updateItem = function (item, item_data) {
            item.icon_src = this.getItemDataProperty(item_data, 'icon_src', '')
            const min = this.getItemDataProperty(item_data, 'minWeight', 0.0)
            const max = this.getItemDataProperty(item_data, 'maxWeight', 1.0)
            const minWeightRatio = this.getItemDataProperty(item_data, 'minWeightRatio', 0)
            const maxWeightRatio = this.getItemDataProperty(item_data, 'maxWeightRatio', 0)
            const minWeight = min + (max - min) * minWeightRatio;
            const maxWeight = min + (max - min) * maxWeightRatio;
            const weight = min + (max - min) * this.getItemDataProperty(item_data, 'weightRatio', 0.0);
            const totalCaught = this.getItemDataProperty(item_data, 'totalCatches', 0)
            const name = this.getItemDataProperty(item_data, 'name', 'no_name')

            item.updateText(`${name} ${weight.toFixed(3)}kg`);
            item.updateInfo(`Total Caught:${totalCaught} <br> Min Weight:${minWeight.toFixed(3)}kg <br> Max Weight::${maxWeight.toFixed(3)}kg`);

        }
        //should one day allow more info in fish caught so it could try to update that single fish
        //but for now the amount of fish is limited. also the display may undergo a redesign
        game.onFishCaught = function () {
            inventory.load(game.player.logs.fish)
            inventory.updateItems();
            updateInventoryButtons();
        }

        if (game.player.logs.fish){
            inventory.load(game.player.logs.fish)
        }

        inventory.updateItems();
        updateInventoryButtons()

        //this here here for cleanup of old data untill I design a place for it
        const saveKeys = ["client", "player", "/client", "/player", "fishing_save_state"]
        window.clearSave = function () {
            for (let key of saveKeys) {
                if (localStorage.getItem(key)) {
                    localStorage.removeItem(key);
                }
                if (sessionStorage.getItem(key)) {
                    sessionStorage.removeItem(key);
                }
            }
            delete game.player.inventory;
            delete game.client.sound_volume;
            delete game.client.save_locally;
            delete game.client.save_version;
        }

    </script>
