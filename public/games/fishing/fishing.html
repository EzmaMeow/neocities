    <script type="module">
        import { start_fishing_game } from "./fishing.js"
        import { Inventory } from "/scripts/inventory.js"

        const game = await start_fishing_game();
        const inventory = new Inventory('inventory')

        const inventoryPreviousButton = document.getElementById('inventory_previous');
        const inventoryNextButton = document.getElementById('inventory_next');
        function updateInventoryButtons() {
            inventoryPreviousButton.hidden = !inventory.hasPreviousPage();
            inventoryNextButton.hidden = !inventory.hasNextPage();
        }
        inventoryPreviousButton.addEventListener('click', (event) => {
            inventory.previousPage();
            updateInventoryButtons()
        })
        inventoryNextButton.addEventListener('click', (event) => {
            inventory.nextPage();
            updateInventoryButtons()
        })

        inventory.updateItem = function (item, item_data) {
            item.icon_src = this.getItemDataProperty(item_data, 'icon_src', '')
            const min = this.getItemDataProperty(item_data, 'min_weight', 0.0)
            const max = this.getItemDataProperty(item_data, 'max_weight', 1.0)
            const min_weight_ratio = this.getItemDataProperty(item_data, 'min_weight_ratio', 0)
            const max_weight_ratio = this.getItemDataProperty(item_data, 'max_weight_ratio', 0)
            const min_weight = min + (max - min) * min_weight_ratio;
            const max_weight = min + (max - min) * max_weight_ratio;
            const weight = min + (max - min) * this.getItemDataProperty(item_data, 'weight_ratio', 0.0);
            const total_caught = this.getItemDataProperty(item_data, 'total_catches', 0)
            const name = this.getItemDataProperty(item_data, 'name', 'no_name')

            item.updateText(`${name} ${weight.toFixed(3)}kg`);
            item.updateInfo(`Total Caught:${total_caught} <br> Min Weight:${min_weight.toFixed(3)}kg <br> Max Weight::${max_weight.toFixed(3)}kg`);

        }
        game.onFishCaught = function () {
            inventory.load(game.inventory)
            inventory.updateItems();
            updateInventoryButtons();
            //needed to reset the ref since inventory load makes a new array (and why the script need to be split into a invetory state and inventory display)
            game.player.inventory = inventory.inventoryData;
        }
        //this is a hack to load invetory untill inventory is split up to handle core and implemention
        if (game.player.inventory) {
            if (!game.inventory){
                game.inventory = new Map();
            }
            if (!Array.isArray(game.player.inventory)){
                game.player.inventory = inventory.inventoryData
            }
            game.player.inventory.forEach(item => {
                const type = item[0];
                const data = item[1]; 
                game.inventory.set(type,data)
            });
        }

        inventory.load(
            game.inventory
        )
        //set the player state inventory to the ref of inventory data since it should be safe for json as long as it keep sync with game inventory
        game.player.inventory = inventory.inventoryData;

        inventory.updateItems();
        updateInventoryButtons()

        //this here here for cleanup of old data untill I design a place for it
        const saveKeys = ["client", "player", "/client", "/player", "fishing_save_state"]
        window.clearSave = function () {
            for (let key of saveKeys) {
                if (localStorage.getItem(key)) {
                    localStorage.removeItem(key);
                }
                if (sessionStorage.getItem(key)) {
                    sessionStorage.removeItem(key);
                }
            }
        }

    </script>
