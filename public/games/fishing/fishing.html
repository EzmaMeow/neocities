    <script type="module">
        import { start_fishing_game } from "./fishing.js"

        //TODO: should give details or something inside an id base on the entry soopen detials stay open
        const fishingLog = {
            page: 0,
            logData: {},
            definitions: {},
            maxEntries: 10,
            entries: [],
            logEntriesElement: document.getElementById('inventory'),
            //NOTE: this will use defininitions to get the real values 
            updateEntry(entry, entryName, entryData) {
                //directly acessing it instead of loading for now untill this moves to its own file and class. also could pull from game.fish_data if move below
                const entryDefinition = this.definitions[entryName];
                if (!entryDefinition) {
                    console.log(entryName)
                    return
                }
                const icon = entryData.icon || entryDefinition.icon || ""
                const min = entryData.minWeight || entryDefinition.minWeight || 0.0
                const max = entryData.maxWeight || entryDefinition.maxWeight || 1.0
                const minWeightRatio = entryData.minWeightRatio || entryDefinition.minWeightRatio || 0.0
                const maxWeightRatio = entryData.maxWeightRatio || entryDefinition.maxWeightRatio || 0.0
                const weightRatio = entryData.weightRatio || entryDefinition.weightRatio || 0.0
                const minWeight = min + (max - min) * minWeightRatio;
                const maxWeight = min + (max - min) * maxWeightRatio;
                const weight = min + (max - min) * weightRatio;
                const totalCaught = entryData.totalCatches || entryDefinition.totalCatches || 0;
                const name = entryData.name || entryDefinition.name || "no name"
                entry.innerHTML = `
                <details>
                    <summary>${icon ? `<img src=${icon} alt="Log Entry Icon">` : ""}${name} ${weight.toFixed(3)}kg</summary>
                    <p>Total caught: ${totalCaught}</p>
                    <p>Min weight: ${minWeight.toFixed(3)}</p>
                    <p>Max weight: ${maxWeight.toFixed(3)}</p>
                </details>
                `
            },
            updateEntries() {
                if (this.entries.length < this.maxEntries) {
                    this.entries.length = 0;
                    for (let i = 0; i < this.maxEntries; i++) {
                        const entry = document.createElement('log-entry')
                        this.entries.push(entry)
                        this.logEntriesElement.appendChild(entry)
                    }
                }
                const page = this.page || 0;
                const pageStart = page * this.maxEntries;
                const dataKeys = Object.keys(this.logData);
                const dataLength = dataKeys.length;
                for (let i = 0; i < this.maxEntries; i++) {
                    const entry = this.entries[i];
                    const pagePosition = pageStart + i;
                    if (pagePosition < 0) { continue; }
                    if (pagePosition >= dataLength) {
                        entry.hidden = true;
                        continue;
                    }
                    entry.hidden = false;
                    const entryName = dataKeys[pagePosition]
                    const entryData = this.logData[entryName]
                    this.updateEntry(entry, entryName, entryData);
                }
            },
            hasPreviousPage() {
                return this.page > 0;
            },
            hasNextPage() {
                return (this.page + 1) * this.maxEntries < Object.keys(this.logData).length;
            },
            nextPage() {
                if (this.hasNextPage()) {
                    this.page += 1;
                    this.updateEntries();
                    this.logEntriesElement.scrollIntoView({ behavior: 'smooth' });
                }
            },
            previousPage() {
                if (this.hasPreviousPage()) {
                    this.page -= 1;
                    this.updateEntries();
                    this.logEntriesElement.scrollIntoView({ behavior: 'smooth' });
                }
            },
        }

        const game = await start_fishing_game();

        fishingLog.definitions = game.fishData

        const fishLogPreviousButton = document.getElementById('inventory_previous');
        const fishLogNextButton = document.getElementById('inventory_next');

        function updateFishLogButtons() {
            fishLogPreviousButton.hidden = !fishingLog.hasPreviousPage();
            fishLogNextButton.hidden = !fishingLog.hasNextPage();
        }
        fishLogPreviousButton.addEventListener('click', (event) => {
            fishingLog.previousPage();
            updateFishLogButtons();

        })
        fishLogNextButton.addEventListener('click', (event) => {
            fishingLog.nextPage();
            updateFishLogButtons();
        })

        //should one day allow more info in fish caught so it could try to update that single fish
        //but for now the amount of fish is limited. also the display may undergo a redesign
        game.onFishCaught = function () {
            fishingLog.updateEntries();
            updateFishLogButtons();
        }
        if (!game.player.logs) {game.player.logs = {}}
        if (!game.player.logs.fish) {game.player.logs.fish = {}}
        fishingLog.logData = game.player.logs.fish

        game.onReady =()=>{
            fishingLog.updateEntries();
        }
        
        updateFishLogButtons()

        //this here here for cleanup of old data untill I design a place for it
        const saveKeys = ["client", "player", "/client", "/player", "fishing_save_state"]
        window.clearSave = function () {
            for (let key of saveKeys) {
                if (localStorage.getItem(key)) {
                    localStorage.removeItem(key);
                }
                if (sessionStorage.getItem(key)) {
                    sessionStorage.removeItem(key);
                }
            }
            delete game.player.inventory;
            delete game.client.sound_volume;
            delete game.client.save_locally;
            delete game.client.save_version;
        }

    </script>
